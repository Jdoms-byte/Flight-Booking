{% extends 'ClientBookingProcess.html' %}

{% block title %} Home {% endblock %}

{% block content %}
<style>
  .form-radio{
    width: 20px;
    height: 20px;
    cursor: pointer;
  }
  .form-radio:checked{
    accent-color: #053322;
  }
</style>

<section>
     <div   class="min-h-100 bg-cover bg-center bg-no-repeat flex items-center justify-center px-4 transition-all duration-1000 ease-in-out"
 id="backgroundImage">

    <div class="bg-white  bg-opacity-80 rounded-lg p-6 w-screen max-w-3xl max-h-screen shadow-md mt-50 mb-10">
      <form method="POST">
      <!-- Trip Type Options -->
      <div class="flex justify-center space-x-4 mb-6" id="trip-options">
        <label class="flex items-center space-x-2">
          <input type="radio" name="tripType" value="roundTrip" class="form-radio text-green-600" checked>
          <span class="bg-emerald-950 text-white px-4 py-1 border border-green-900 rounded cursor-pointer">Round-trip</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="radio" name="tripType" value="oneWay" class="form-radio text-green-600">
          <span class="bg-white text-black px-4 py-1 border border-green-900 rounded cursor-pointer">One-way</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="radio" name="tripType" value="multiCity" class="form-radio text-green-600">
          <span class="bg-white text-black px-4 py-1 border border-green-900 rounded cursor-pointer">Multi-City</span>
        </label>
      </div>

      <script>
        const tripOptions = document.querySelectorAll('#trip-options label');

        tripOptions.forEach( label =>{
          label.addEventListener( 'click', ()=>{
              tripOptions.forEach(l =>{
                l.querySelector('span').classList.remove('bg-emerald-950', 'text-white');
                l.querySelector('span').classList.add('bg-white', 'text-black')
              });
            label.querySelector('span').classList.remove('bg-white', 'text-black');
            label.querySelector('span').classList.add('bg-emerald-950', 'text-white')  ;
          });
        });

      </script>

      <!-- Form Fields -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-black">
        <div>
          <label class="block mb-1 text-sm" for="departure">Departure</label>
          <input type="text" name="departure" list="departure-list" placeholder="Enter departure" class="w-full px-3 py-2 border rounded" required>
            <datalist id="departure-list">
              {% for airport in countryAndCity %}
                <option value="{{ airport.country }}, {{airport.city}}">
              {% endfor %}
            </datalist>
        </div>
        <div>
          <label class="block mb-1 text-sm" for="destination">Destination</label>
          <input type="text" name="destination" list="departure-list" placeholder="Enter destination" class="w-full px-3 py-2 border rounded" required>
            <datalist id="departure-list">
                {% for airport in countryAndCity %}
                  <option value="{{ airport.country }}, {{airport.city}}">
                {% endfor %}
              </datalist>
        </div>
        <div>
          <label class="block mb-1 text-sm" for="departOn">Depart On</label>
          <input type="date" name="departOn" class="w-full px-3 py-2 border rounded" required>
        </div>
        <div>
          <label class="block mb-1 text-sm" for="returnOn">Return On</label>
          <input type="date" name="returnOn" class="w-full px-3 py-2 border rounded" required>
        </div>
      </div>

      <!-- Button -->
      <div class="mt-6 text-center">
        <button type="submit" class="bg-emerald-950 hover:bg-emerald-900 text-white px-20 cursor-pointer py-2 rounded">
          Search Flights
        </button>
      </div>

      </form>
    </div>
  </div>
</section>

<script>
   const image = [
    "{{ url_for('static', filename='img/bg1.png') }}",
    "{{ url_for('static', filename='img/bg2.png') }}",
    "{{ url_for('static', filename='img/bg3.png') }}"
  ];  let index = 0;

  const slideimg = document.getElementById('backgroundImage');

  function showImage(index){
    slideimg.style.backgroundImage = `url('${image[index]}')`;
  }

  function nextImage(){
    index = (index + 1) % image.length;
    showImage(index)
  }

  function prevImage(){
    index = (index - 1 + image.length) % image.length;
    showImage(index)
  }

  showImage(index)
  setInterval(nextImage, 3000)


</script>


{% endblock %}
