<form method="POST">
  <div class="grid grid-cols-4 gap-2">
    {% for row in range(1, 21) %}
      {% for col in ['A', 'B', 'C', 'D'] %}
        <div class="flex flex-col items-center border p-2">
          <label>{{ row }}{{ col }}</label>
          <select name="seats[{{ row }}{{ col }}]" class="form-select">
            {% for sc in seat_classes %}
              <option value="{{ sc.id }}">{{ sc.name }}</option>
            {% endfor %}
          </select>
        </div>
      {% endfor %}
    {% endfor %}
  </div>
  <button type="submit" class="btn btn-primary mt-4">Save Layout</button>
</form>
